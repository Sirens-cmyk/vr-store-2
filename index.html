<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>شبیه‌ساز سه‌بعدی رفتار مصرف‌کننده و چیدمان فروشگاه</title>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { overflow: hidden; background: #0b1120; color: #f8fafc; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }

        /* پنل‌های کنترلی بالای صفحه */
        #ui-panels {
            position: fixed; top: 14px; right: 14px; left: 14px;
            max-width: 380px; margin: 0 auto;
            display: flex; flex-direction: column; gap: 10px;
            z-index: 100; pointer-events: none;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 14px;
            padding: 12px 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            pointer-events: auto;
        }
        .card-header {
            display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; font-weight: bold; font-size: 13px; color: #38bdf8;
        }
        .card-body { margin-top: 10px; }
        .card-body.collapsed { display: none; }

        .btn-primary {
            width: 100%; background: #2563eb; color: #fff; border: none;
            padding: 10px; border-radius: 10px; font-weight: bold; font-size: 13px;
            cursor: pointer; margin-top: 8px; transition: background 0.2s;
        }
        .btn-primary:hover { background: #1d4ed8; }

        .hotspot-list {
            display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px;
        }
        .hotspot-btn {
            background: rgba(30, 41, 59, 0.9); color: #e2e8f0;
            border: 1px solid rgba(56, 189, 248, 0.3); padding: 7px 8px;
            border-radius: 8px; font-size: 11px; cursor: pointer; text-align: center;
            transition: all 0.2s;
        }
        .hotspot-btn:hover, .hotspot-btn.active {
            background: #0284c7; color: #fff; border-color: #7dd3fc;
        }

        /* نوار سبد خرید پایین صفحه */
        #bottom-cart-bar {
            position: fixed; bottom: 16px; left: 16px; right: 16px;
            max-width: 380px; margin: 0 auto;
            background: rgba(6, 78, 59, 0.9); backdrop-filter: blur(10px);
            border: 1px solid #10b981; border-radius: 14px;
            padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
            z-index: 100; cursor: pointer; box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            font-size: 13px; font-weight: bold; color: #ecfdf5;
        }

        /* پاپ‌آپ جزئیات محصول هنگام زوم روی ویترین */
        #product-popup {
            display: none; position: fixed; bottom: 75px; left: 16px; right: 16px;
            max-width: 360px; margin: 0 auto;
            background: rgba(15, 23, 42, 0.95); border: 1px solid #38bdf8;
            border-radius: 14px; padding: 14px; z-index: 200;
            box-shadow: 0 15px 40px rgba(0,0,0,0.85);
            animation: slideUp 0.2s ease-out;
        }
        @keyframes slideUp { from { transform: translateY(15px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* مودال سبد خرید */
        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75);
            z-index: 1000; justify-content: center; align-items: center; padding: 16px;
        }
        .modal-box {
            background: #0f172a; border: 1px solid #38bdf8; border-radius: 16px;
            width: 360px; max-width: 100%; padding: 18px;
        }
        .cart-row {
            display: flex; justify-content: space-between; align-items: center;
            background: #1e293b; padding: 8px 10px; border-radius: 8px; margin-bottom: 6px; font-size: 12px;
        }
    </style>
</head>
<body>

    <!-- پنل‌های کنترلی بالا -->
    <div id="ui-panels">
        <!-- کارت ۱: کنترل شبیه‌ساز -->
        <div class="glass-card">
            <div class="card-header" onclick="toggleCard('sim-body', this)">
                <span>🛒 کنترل شبیه‌ساز</span>
                <span>▼</span>
            </div>
            <div id="sim-body" class="card-body">
                <p style="font-size: 11px; color: #94a3b8; line-height: 1.5;">
                    محصولات ریز در طبقات بالایی از راه دور نامشخص هستند؛ روی هر ویترین کلیک کنید تا دوربین به آن نزدیک شود.
                </p>
                <button id="tour-btn" class="btn-primary" onclick="toggleAutoTour()">▶ تور خودکار ارائه</button>
            </div>
        </div>

        <!-- کارت ۲: نقاط استراتژیک (Hotspots) -->
        <div class="glass-card">
            <div class="card-header" onclick="toggleCard('hotspots-body', this)">
                <span>🎯 نقاط استراتژیک و ویترین‌ها (Hotspots)</span>
                <span>▼</span>
            </div>
            <div id="hotspots-body" class="card-body">
                <div class="hotspot-list">
                    <button class="hotspot-btn active" onclick="focusZone('overview', this)">🏠 نمای کلی فروشگاه</button>
                    <button class="hotspot-btn" onclick="focusZone('eye_wall', this)">👁️ ویترین روبرو (چشم فروشگاه)</button>
                    <button class="hotspot-btn" onclick="focusZone('shelf_left', this)">📦 قفسه سمت چپ</button>
                    <button class="hotspot-btn" onclick="focusZone('shelf_right', this)">🧴 قفسه سمت راست</button>
                    <button class="hotspot-btn" onclick="focusZone('counter', this)" style="grid-column: span 2;">💳 پیشخوان و محصولات انگیزشی</button>
                </div>
            </div>
        </div>
    </div>

    <!-- پاپ‌آپ خرید سریع محصول انتخابی -->
    <div id="product-popup">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
            <strong id="popup-title" style="color:#38bdf8; font-size:14px;">نام کالا</strong>
            <button onclick="closePopup()" style="background:none; border:none; color:#ef4444; font-size:16px; cursor:pointer;">✖</button>
        </div>
        <div id="popup-desc" style="font-size:11px; color:#cbd5e1; margin-bottom:10px;">توضیحات کالا</div>
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <span id="popup-price" style="color:#34d399; font-weight:bold; font-size:13px;">0 هزار تومان</span>
            <button id="popup-add-btn" style="background:#10b981; color:#000; border:none; padding:7px 14px; border-radius:8px; font-weight:bold; font-size:12px; cursor:pointer;">+ افزودن به سبد</button>
        </div>
    </div>

    <!-- نوار پایین سبد خرید -->
    <div id="bottom-cart-bar" onclick="openCartModal()">
        <span>🛍️ سبد خرید: <span id="cart-count">0</span> کالا</span>
        <span>مجموع: <span id="cart-total">0</span> هزار تومان</span>
    </div>

    <!-- مودال جزئیات سبد خرید -->
    <div id="cart-modal" class="modal-overlay">
        <div class="modal-box">
            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #1e293b; padding-bottom:10px; margin-bottom:10px;">
                <strong style="color:#38bdf8;">🛍️ لیست خرید شبیه‌سازی</strong>
                <button onclick="closeCartModal()" style="background:none; border:none; color:#ef4444; font-size:18px; cursor:pointer;">✖</button>
            </div>
            <div id="cart-items-list" style="max-height:220px; overflow-y:auto;"></div>
            <div style="border-top:1px solid #1e293b; padding-top:10px; margin-top:10px; display:flex; justify-content:space-between; font-size:13px; font-weight:bold;">
                <span>قابل پرداخت:</span>
                <span id="modal-total" style="color:#34d399;">0 هزار تومان</span>
            </div>
            <button onclick="checkout()" class="btn-primary" style="background:#10b981; color:#000; margin-top:12px;">تایید و ثبت رفتار خرید</button>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ۱. تنظیمات صحنه (همرنگ محیط)
        const scene = new THREE.Scene();
        const ENV_COLOR = 0x0b1120;
        scene.background = new THREE.Color(ENV_COLOR);
        scene.fog = new THREE.FogExp2(ENV_COLOR, 0.032);

        const camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 0.05, 100);
        // زاویه دید اولیه کمی دورتر تا تفاوت سایز محصولات بزرگ و ریز کاملاً حس شود
        camera.position.set(0, 5.2, 10.8);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.maxPolarAngle = Math.PI / 2 - 0.03;
        controls.minDistance = 0.6;
        controls.target.set(0, 1.5, -1.2);

        // ۲. نورپردازی
        scene.add(new THREE.AmbientLight(0x94a3b8, 1.45));

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.6);
        dirLight.position.set(5, 10, 7);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const eyeWallLight = new THREE.PointLight(0x38bdf8, 6, 8);
        eyeWallLight.position.set(0, 3.2, -3.5);
        scene.add(eyeWallLight);

        // ۳. کف گریددار + دیوار روبرو همرنگ محیط
        const gridHelper = new THREE.GridHelper(26, 26, 0x1d4ed8, 0x1e293b);
        scene.add(gridHelper);

        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(26, 26),
            new THREE.MeshStandardMaterial({ color: 0x090e1a, roughness: 0.85 })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        const backWall = new THREE.Mesh(
            new THREE.BoxGeometry(15, 5.4, 0.25),
            new THREE.MeshStandardMaterial({ color: ENV_COLOR, roughness: 0.9, metalness: 0.1 })
        );
        backWall.position.set(0, 2.7, -4.9);
        backWall.receiveShadow = true;
        scene.add(backWall);

        const wallFrame = new THREE.LineSegments(
            new THREE.EdgesGeometry(new THREE.BoxGeometry(5.6, 3.5, 0.05)),
            new THREE.LineBasicMaterial({ color: 0x1e3a8a })
        );
        wallFrame.position.set(0, 1.85, -4.75);
        scene.add(wallFrame);

        // ۴. سیستم تعامل و کلیک
        const interactiveObjects = [];
        const shelfMat = new THREE.MeshStandardMaterial({ color: 0x334155, metalness: 0.6, roughness: 0.3 });
        const glassMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.25, roughness: 0.1 });

        function createRack(width, height, depth, shelvesCount, pos, rotY, zoneId, zoneLabel) {
            const group = new THREE.Group();
            group.position.set(pos.x, pos.y, pos.z);
            group.rotation.y = rotY;

            const legGeo = new THREE.BoxGeometry(0.07, height, 0.07);
            const dx = width / 2 - 0.04;
            const dz = depth / 2 - 0.04;
            [[-dx, -dz], [dx, -dz], [-dx, dz], [dx, dz]].forEach(([lx, lz]) => {
                const leg = new THREE.Mesh(legGeo, shelfMat);
                leg.position.set(lx, height / 2, lz);
                group.add(leg);
            });

            const shelfYPositions = [];
            for (let i = 0; i < shelvesCount; i++) {
                // فاصله عمودی طبقات به گونه‌ای که طبقه پایین جای محصولات خیلی بزرگ و طبقه بالا جای محصولات ریز را داشته باشد
                const sy = 0.28 + i * ((height - 0.65) / Math.max(1, shelvesCount - 1));
                shelfYPositions.push(sy);

                const plate = new THREE.Mesh(new THREE.BoxGeometry(width, 0.045, depth), shelfMat);
                plate.position.set(0, sy, 0);
                plate.castShadow = true;
                plate.receiveShadow = true;
                group.add(plate);

                const glassStrip = new THREE.Mesh(new THREE.BoxGeometry(width - 0.08, 0.06, 0.015), glassMat);
                glassStrip.position.set(0, sy + 0.05, depth / 2);
                group.add(glassStrip);
            }

            // باکس کلیک برای کل ویترین
            const hitBox = new THREE.Mesh(
                new THREE.BoxGeometry(width + 0.25, height + 0.25, depth + 0.25),
                new THREE.MeshBasicMaterial({ visible: false })
            );
            hitBox.position.set(0, height / 2, 0);
            hitBox.userData = { type: 'zone', zoneId: zoneId, label: zoneLabel };
            interactiveObjects.push(hitBox);
            group.add(hitBox);

            // نشانگر Hotspot شناور بالای قفسه
            const beacon = new THREE.Mesh(
                new THREE.SphereGeometry(0.13, 16, 16),
                new THREE.MeshBasicMaterial({ color: 0x38bdf8 })
            );
            beacon.position.set(0, height + 0.3, 0);
            beacon.userData = { type: 'zone', zoneId: zoneId, label: zoneLabel };
            interactiveObjects.push(beacon);
            group.add(beacon);

            scene.add(group);
            return { group, shelfYPositions };
        }

        // تابع چیدمان چندردیفه عمقی (جلو و عقب شلف) با سایزهای کاملاً متفاوت
        function populateShelf(rackGroup, shelfY, itemsConfig, zoneId) {
            itemsConfig.forEach(item => {
                let geo;
                if (item.shape === 'box') {
                    geo = new THREE.BoxGeometry(item.w, item.h, item.d);
                } else if (item.shape === 'cylinder') {
                    geo = new THREE.CylinderGeometry(item.w / 2, item.w / 2, item.h, 16);
                } else {
                    geo = new THREE.SphereGeometry(item.w / 2, 14, 14);
                }

                const mat = new THREE.MeshStandardMaterial({
                    color: item.color,
                    roughness: 0.35,
                    metalness: 0.15,
                    emissive: item.color,
                    emissiveIntensity: 0.12
                });

                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(item.x, shelfY + 0.022 + item.h / 2, item.z || 0);
                mesh.castShadow = true;

                mesh.userData = {
                    type: 'product',
                    zoneId: zoneId,
                    name: item.name,
                    price: item.price,
                    desc: item.desc
                };
                interactiveObjects.push(mesh);
                rackGroup.add(mesh);
            });
        }

        // =========================================================================
        // ۱. ویترین روبرو (چشم فروشگاه - ۳ طبقه: خیلی بزرگ -> متوسط -> خیلی ریز)
        // =========================================================================
        const eyeRack = createRack(4.8, 3.1, 0.95, 3, { x: 0, y: 0, z: -4.15 }, 0, 'eye_wall', 'ویترین روبرو (چشم فروشگاه)');

        // ردیف پایین (طبقه ۱): محصولات خیلی بزرگ و حجیم (کاملاً واضح از راه دور)
        populateShelf(eyeRack.group, eyeRack.shelfYPositions[0], [
            { shape: 'box', w: 0.95, h: 0.72, d: 0.65, x: -1.65, z: 0.05, color: 0x3b82f6, name: 'پک خانواده XXL (سایز خیلی بزرگ)', price: 580, desc: 'محصول حجیم طبقه اول با بیشترین قدرت دید از ورودی فروشگاه' },
            { shape: 'box', w: 1.05, h: 0.78, d: 0.65, x: -0.45, z: 0.05, color: 0x0ea5e9, name: 'دستگاه اسپرسوساز حرفه‌ای (باکس بزرگ)', price: 1450, desc: 'کالای کانونی بزرگ در مرکز ویترین روبرو' },
            { shape: 'cylinder', w: 0.78, h: 0.75, d: 0.78, x: 0.72, z: 0.05, color: 0x6366f1, name: 'مخزن پروتئین ۵ کیلویی (بزرگ)', price: 920, desc: 'استوانه بزرگ در ردیف اول چشم فروشگاه' },
            { shape: 'box', w: 0.90, h: 0.68, d: 0.65, x: 1.75, z: 0.05, color: 0x8b5cf6, name: 'ست پذیرایی لوکس (سایز بزرگ)', price: 760, desc: 'جعبه بزرگ در سمت راست طبقه اول' }
        ], 'eye_wall');

        // ردیف وسط (طبقه ۲): محصولات سایز متوسط (۲ ردیف عمقی جلو و عقب روی شلف)
        const midItemsEye = [];
        const midColors = [0xec4899, 0xf59e0b, 0x10b981, 0x06b6d4];
        for (let row = 0; row < 2; row++) { // دو ردیف عمقی روی شلف وسط
            const zPos = row === 0 ? 0.22 : -0.18;
            for (let i = 0; i < 9; i++) {
                const xPos = -1.95 + i * 0.48;
                midItemsEye.push({
                    shape: (i + row) % 2 === 0 ? 'cylinder' : 'box',
                    w: 0.28, h: 0.34, d: 0.26,
                    x: xPos, z: zPos,
                    color: midColors[(i + row) % midColors.length],
                    name: `محصول متوسط ردیف ${row + 1} - کد ${i + 1}`,
                    price: 140 + i * 15,
                    desc: 'محصول سایز متوسط در تراز دید میانی (چیدمان دو ردیفه روی شلف)'
                });
            }
        }
        populateShelf(eyeRack.group, eyeRack.shelfYPositions[1], midItemsEye, 'eye_wall');

        // ردیف بالا (طبقه ۳): محصولات خیلی ریز و مینیاتوری (۳ ردیف عمقی؛ از دور نامشخص و نیازمند زوم)
        const tinyItemsEye = [];
        const tinyColors = [0xf43f5e, 0xfacc15, 0x4ade80, 0x38bdf8, 0xc084fc];
        for (let row = 0; row < 3; row++) { // سه ردیف عمقی روی شلف بالا
            const zPos = 0.28 - row * 0.24;
            for (let i = 0; i < 18; i++) {
                const xPos = -2.1 + i * 0.245;
                tinyItemsEye.push({
                    shape: i % 2 === 0 ? 'cylinder' : 'box',
                    w: 0.085, h: 0.11, d: 0.085, // ابعاد بسیار ریز!
                    x: xPos, z: zPos,
                    color: tinyColors[(i + row) % tinyColors.length],
                    name: `محصول مینیاتوری بسیار ریز (ردیف ${row + 1} - شماره ${i + 1})`,
                    price: 45 + (i % 5) * 10,
                    desc: 'کالای سایز خیلی کوچک؛ از راه دور قابل تشخیص نیست و با نزدیک شدن به ویترین قابل بررسی و خرید است.'
                });
            }
        }
        populateShelf(eyeRack.group, eyeRack.shelfYPositions[2], tinyItemsEye, 'eye_wall');


        // =========================================================================
        // ۲. قفسه سمت چپ (۳ طبقه: بزرگ در پایین، متوسط در وسط، خیلی ریز در بالا)
        // =========================================================================
        const leftRack = createRack(2.8, 2.6, 0.85, 3, { x: -3.5, y: 0, z: -1.2 }, Math.PI / 5, 'shelf_left', 'قفسه سمت چپ');

        // طبقه ۱ چپ: محصولات بزرگ
        populateShelf(leftRack.group, leftRack.shelfYPositions[0], [
            { shape: 'box', w: 0.78, h: 0.56, d: 0.55, x: -0.82, z: 0.05, color: 0x0284c7, name: 'باکس شوینده ۴ کیلویی (بزرگ)', price: 340, desc: 'محصول حجیم طبقه پایین قفسه چپ' },
            { shape: 'cylinder', w: 0.62, h: 0.58, d: 0.62, x: 0.02, z: 0.05, color: 0x2563eb, name: 'گالن مایع اقتصادی (بزرگ)', price: 290, desc: 'محصول بزرگ قابل دید از فاصله دور' },
            { shape: 'box', w: 0.72, h: 0.52, d: 0.55, x: 0.84, z: 0.05, color: 0x4f46e5, name: 'پک دستمال ۱۸ عددی (بزرگ)', price: 260, desc: 'بسته بزرگ سمت راست طبقه اول' }
        ], 'shelf_left');

        // طبقه ۲ چپ: محصولات متوسط (۲ ردیف عمقی)
        const midItemsLeft = [];
        for (let row = 0; row < 2; row++) {
            const zPos = row === 0 ? 0.18 : -0.16;
            for (let i = 0; i < 6; i++) {
                midItemsLeft.push({
                    shape: i % 2 === 0 ? 'cylinder' : 'box',
                    w: 0.24, h: 0.28, d: 0.22,
                    x: -1.05 + i * 0.42, z: zPos,
                    color: row === 0 ? 0x14b8a6 : 0x06b6d4,
                    name: `شامپو و مراقبتی متوسط چپ (${row + 1}-${i + 1})`,
                    price: 115 + i * 10,
                    desc: 'محصول سایز متوسط در طبقه میانی قفسه چپ'
                });
            }
        }
        populateShelf(leftRack.group, leftRack.shelfYPositions[1], midItemsLeft, 'shelf_left');

        // طبقه ۳ چپ: محصولات خیلی ریز (۳ ردیف عمقی)
        const tinyItemsLeft = [];
        for (let row = 0; row < 3; row++) {
            const zPos = 0.24 - row * 0.22;
            for (let i = 0; i < 11; i++) {
                tinyItemsLeft.push({
                    shape: i % 2 === 0 ? 'cylinder' : 'box',
                    w: 0.08, h: 0.10, d: 0.08, // خیلی ریز
                    x: -1.15 + i * 0.23, z: zPos,
                    color: [0xf43f5e, 0xfbbf24, 0xa855f7][i % 3],
                    name: `اسانس و سرم مینیاتوری چپ (${row + 1}-${i + 1})`,
                    price: 55 + i * 5,
                    desc: 'بطری بسیار کوچک؛ نیازمند زوم روی قفسه سمت چپ برای مشاهده دقیق'
                });
            }
        }
        populateShelf(leftRack.group, leftRack.shelfYPositions[2], tinyItemsLeft, 'shelf_left');


        // =========================================================================
        // ۳. قفسه سمت راست (۳ طبقه: بزرگ در پایین، متوسط در وسط، خیلی ریز در بالا)
        // =========================================================================
        const rightRack = createRack(2.8, 2.6, 0.85, 3, { x: 3.5, y: 0, z: -1.2 }, -Math.PI / 5, 'shelf_right', 'قفسه سمت راست');

        // طبقه ۱ راست: محصولات بزرگ
        populateShelf(rightRack.group, rightRack.shelfYPositions[0], [
            { shape: 'cylinder', w: 0.68, h: 0.55, d: 0.68, x: -0.82, z: 0.05, color: 0xd97706, name: 'قوطی فلزی شیرینی بزرگ', price: 320, desc: 'محصول حجیم طبقه اول قفسه راست' },
            { shape: 'box', w: 0.78, h: 0.58, d: 0.55, x: 0.02, z: 0.05, color: 0xea580c, name: 'باکس شکلات پذیرایی بزرگ', price: 480, desc: 'جعبه بزرگ ویژه با دید عالی از راه دور' },
            { shape: 'box', w: 0.70, h: 0.50, d: 0.55, x: 0.84, z: 0.05, color: 0xdc2626, name: 'پک آجیل و خشکبار XL', price: 690, desc: 'محصول بزرگ انتهای طبقه پایین' }
        ], 'shelf_right');

        // طبقه ۲ راست: محصولات متوسط (۲ ردیف عمقی)
        const midItemsRight = [];
        for (let row = 0; row < 2; row++) {
            const zPos = row === 0 ? 0.18 : -0.16;
            for (let i = 0; i < 6; i++) {
                midItemsRight.push({
                    shape: i % 2 === 0 ? 'box' : 'cylinder',
                    w: 0.24, h: 0.28, d: 0.22,
                    x: -1.05 + i * 0.42, z: zPos,
                    color: row === 0 ? 0xf59e0b : 0xec4899,
                    name: `بسته تنقلات متوسط راست (${row + 1}-${i + 1})`,
                    price: 95 + i * 12,
                    desc: 'محصول سایز متوسط در ردیف میانی قفسه راست'
                });
            }
        }
        populateShelf(rightRack.group, rightRack.shelfYPositions[1], midItemsRight, 'shelf_right');

        // طبقه ۳ راست: محصولات خیلی ریز (۳ ردیف عمقی)
        const tinyItemsRight = [];
        for (let row = 0; row < 3; row++) {
            const zPos = 0.24 - row * 0.22;
            for (let i = 0; i < 11; i++) {
                tinyItemsRight.push({
                    shape: i % 2 === 0 ? 'box' : 'cylinder',
                    w: 0.08, h: 0.10, d: 0.08, // خیلی ریز
                    x: -1.15 + i * 0.23, z: zPos,
                    color: [0x22c55e, 0x38bdf8, 0xfacc15][i % 3],
                    name: `ادویه و شکلات مینیاتوری راست (${row + 1}-${i + 1})`,
                    price: 38 + i * 4,
                    desc: 'محصول بسیار کوچک؛ نیازمند زوم روی قفسه سمت راست برای تشخیص'
                });
            }
        }
        populateShelf(rightRack.group, rightRack.shelfYPositions[2], tinyItemsRight, 'shelf_right');


        // =========================================================================
        // ۴. پیشخوان مرکزی (Checkout Counter)
        // =========================================================================
        const counterGroup = new THREE.Group();
        counterGroup.position.set(0, 0, 2.0);

        const counterBody = new THREE.Mesh(
            new THREE.BoxGeometry(2.8, 0.95, 0.9),
            new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.4, metalness: 0.3 })
        );
        counterBody.position.y = 0.475;
        counterBody.castShadow = true;
        counterBody.userData = { type: 'zone', zoneId: 'counter', label: 'پیشخوان' };
        interactiveObjects.push(counterBody);
        counterGroup.add(counterBody);

        populateShelf(counterGroup, 0.93, [
            { shape: 'box', w: 0.14, h: 0.12, d: 0.14, x: -0.8, z: 0.15, color: 0x38bdf8, name: 'آدامس و خوشبوکننده ریز', price: 25, desc: 'محصول خرید لحظه آخری کنار صندوق' },
            { shape: 'cylinder', w: 0.14, h: 0.18, d: 0.14, x: -0.45, z: 0.15, color: 0xf43f5e, name: 'نوشیدنی انرژی‌زا کوچک', price: 45, desc: 'قرار گرفته روی کانتر پرداخت' },
            { shape: 'box', w: 0.16, h: 0.12, d: 0.14, x: 0.75, z: 0.15, color: 0xfacc15, name: 'شکلات جیبی', price: 30, desc: 'محصول پرتکرار کنار صندوق' }
        ], 'counter');

        const counterBeacon = new THREE.Mesh(
            new THREE.SphereGeometry(0.14, 16, 16),
            new THREE.MeshBasicMaterial({ color: 0x38bdf8 })
        );
        counterBeacon.position.set(0, 1.35, 0);
        counterBeacon.userData = { type: 'zone', zoneId: 'counter', label: 'پیشخوان' };
        interactiveObjects.push(counterBeacon);
        counterGroup.add(counterBeacon);

        scene.add(counterGroup);


        // =========================================================================
        // ۵. تنظیمات زوم بسیار نزدیک دوربین به هر ویترین برای دیدن محصولات ریز
        // =========================================================================
        const cameraZones = {
            overview:    { pos: new THREE.Vector3(0, 5.2, 10.8),   target: new THREE.Vector3(0, 1.5, -1.2) },
            eye_wall:    { pos: new THREE.Vector3(0, 2.05, -2.05), target: new THREE.Vector3(0, 1.85, -4.15) }, // زوم خیلی نزدیک روی ویترین روبرو
            shelf_left:  { pos: new THREE.Vector3(-1.85, 1.75, -0.05), target: new THREE.Vector3(-3.5, 1.55, -1.2) }, // زوم خیلی نزدیک روی قفسه چپ
            shelf_right: { pos: new THREE.Vector3(1.85, 1.75, -0.05),  target: new THREE.Vector3(3.5, 1.55, -1.2) },  // زوم خیلی نزدیک روی قفسه راست
            counter:     { pos: new THREE.Vector3(0, 2.0, 3.8),    target: new THREE.Vector3(0, 0.95, 2.0) }
        };

        let targetCamPos = cameraZones.overview.pos.clone();
        let targetLookAt = cameraZones.overview.target.clone();
        let isTransitioning = false;

        window.focusZone = function(zoneId, btnElement = null) {
            const zone = cameraZones[zoneId];
            if (!zone) return;

            targetCamPos.copy(zone.pos);
            targetLookAt.copy(zone.target);
            isTransitioning = true;

            document.querySelectorAll('.hotspot-btn').forEach(b => b.classList.remove('active'));
            if (btnElement) {
                btnElement.classList.add('active');
            }
        };

        // ۶. تشخیص کلیک روی ویترین‌ها و محصولات
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        let downPos = { x: 0, y: 0 };

        window.addEventListener('pointerdown', (e) => {
            downPos = { x: e.clientX, y: e.clientY };
            if (e.target === renderer.domElement) {
                isTransitioning = false;
            }
        });

        window.addEventListener('pointerup', (e) => {
            if (e.target !== renderer.domElement) return;
            const dist = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
            if (dist > 6) return;

            pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
            pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(pointer, camera);
            const hits = raycaster.intersectObjects(interactiveObjects);

            if (hits.length > 0) {
                const hitData = hits[0].object.userData;

                if (hitData.zoneId) {
                    focusZone(hitData.zoneId);
                }

                if (hitData.type === 'product') {
                    showProductPopup(hitData);
                } else {
                    closePopup();
                }
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();

            if (isTransitioning) {
                camera.position.lerp(targetCamPos, 0.065);
                controls.target.lerp(targetLookAt, 0.065);
                if (camera.position.distanceTo(targetCamPos) < 0.02) {
                    isTransitioning = false;
                }
            }

            interactiveObjects.forEach(obj => {
                if (obj.geometry && obj.geometry.type === 'SphereGeometry' && obj.userData.type === 'zone') {
                    const s = 1 + Math.sin(t * 4) * 0.15;
                    obj.scale.setScalar(s);
                }
            });

            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>

    <!-- اسکریپت مدیریت رابط کاربری، تور خودکار و سبد خرید -->
    <script>
        let cart = [];
        let tourInterval = null;
        const tourSequence = ['overview', 'eye_wall', 'shelf_left', 'shelf_right', 'counter'];
        let tourIndex = 0;

        function toggleCard(bodyId, headerEl) {
            const body = document.getElementById(bodyId);
            body.classList.toggle('collapsed');
            const arrow = headerEl.querySelector('span:last-child');
            arrow.innerText = body.classList.contains('collapsed') ? '◀' : '▼';
        }

        function toggleAutoTour() {
            const btn = document.getElementById('tour-btn');
            if (tourInterval) {
                clearInterval(tourInterval);
                tourInterval = null;
                btn.innerText = '▶ تور خودکار ارائه';
                btn.style.background = '#2563eb';
            } else {
                btn.innerText = '⏹ توقف تور خودکار';
                btn.style.background = '#dc2626';
                tourIndex = 1;
                window.focusZone(tourSequence[tourIndex]);
                tourInterval = setInterval(() => {
                    tourIndex = (tourIndex + 1) % tourSequence.length;
                    window.focusZone(tourSequence[tourIndex]);
                }, 4500);
            }
        }

        function showProductPopup(data) {
            document.getElementById('popup-title').innerText = data.name;
            document.getElementById('popup-desc').innerText = data.desc;
            document.getElementById('popup-price').innerText = data.price + ' هزار تومان';
            document.getElementById('popup-add-btn').onclick = () => addToCart(data.name, data.price);
            document.getElementById('product-popup').style.display = 'block';
        }

        function closePopup() {
            document.getElementById('product-popup').style.display = 'none';
        }

        function addToCart(name, price) {
            cart.push({ name, price });
            updateCartUI();
            closePopup();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
            openCartModal();
        }

        function updateCartUI() {
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('cart-count').innerText = cart.length;
            document.getElementById('cart-total').innerText = total.toLocaleString();
            document.getElementById('modal-total').innerText = total.toLocaleString() + ' هزار تومان';
        }

        function openCartModal() {
            const list = document.getElementById('cart-items-list');
            list.innerHTML = '';
            if (cart.length === 0) {
                list.innerHTML = '<div style="text-align:center; color:#94a3b8; padding:16px; font-size:12px;">سبد خرید خالی است</div>';
            } else {
                cart.forEach((item, idx) => {
                    const row = document.createElement('div');
                    row.className = 'cart-row';
                    row.innerHTML = `
                        <div>
                            <div style="font-weight:bold;">${item.name}</div>
                            <div style="color:#34d399; font-size:11px;">${item.price} هزار تومان</div>
                        </div>
                        <button onclick="removeFromCart(${idx})" style="background:none; border:none; color:#ef4444; cursor:pointer;">حذف</button>
                    `;
                    list.appendChild(row);
                });
            }
            document.getElementById('cart-modal').style.display = 'flex';
        }

        function closeCartModal() {
            document.getElementById('cart-modal').style.display = 'none';
        }

        function checkout() {
            if (cart.length === 0) return alert('سبد خرید خالی است!');
            alert('✅ سفارش ثبت شد و داده‌های مسیر نگاه و خرید مشتری در شبیه‌ساز ذخیره گردید.');
            cart = [];
            updateCartUI();
            closeCartModal();
        }
    </script>
</body>
